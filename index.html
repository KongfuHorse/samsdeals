<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subdeals · 精选电脑硬件优惠</title>
<meta name="description" content="搜索你关心的电脑硬件，查看最近的价格排行：游戏本、显卡、台式机、固态和机械硬盘。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif:wght@700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FFFFFF; --ink:#1B1A2E; --muted:#4C4A63; --faint:#6B6985; --line:#E7E6EF; --line2:#EFEEF5;
    --band:#FAFAFD; --chip:#F3F2F8; --tile:#FFFFFF; --tileline:#ECEBF3; --first:#F8F7FD;
    --accent:#4338CA; --btn:#4338CA; --hl:#E6E3FF; --rank:#B3B0CC; --field:#CFCDE0; --shadow:rgba(27,26,46,.18);
    --sans:"Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --serif:"Noto Serif", "Noto Serif SC", "Songti SC", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121220; --ink:#ECEBF5; --muted:#BDBBD2; --faint:#9A97B5; --line:#2A2940; --line2:#232236;
      --band:#17162A; --chip:#222138; --tile:#FFFFFF; --tileline:#FFFFFF; --first:#1B1A33;
      --accent:#ABA6FF; --btn:#5046E5; --hl:#2E2A5C; --rank:#5C5980; --field:#3A3955; --shadow:rgba(0,0,0,.45);
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 var(--sans); }
  a { color:inherit; text-decoration:none; }
  button, input { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }
  [hidden] { display:none !important; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 24px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* 顶栏 */
  .top { position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
  .top .wrap { display:flex; flex-wrap:wrap; align-items:center; gap:12px 28px; padding-top:14px; padding-bottom:14px; }
  .logo { font-size:26px; letter-spacing:-.03em; line-height:1; white-space:nowrap; }
  .logo b { font-weight:800; color:var(--accent); }
  .logo span { font-weight:500; }
  .top .spacer { flex:1; }
  .top .search { flex:1 1 320px; max-width:560px; }
  /* 标签页顶栏的订阅框 */
  .hsub { display:flex; gap:8px; flex:0 1 340px; min-width:0; }
  .hsub input { flex:1; min-width:0; height:44px; padding:0 14px; border:1.5px solid var(--field); border-radius:10px; background:var(--bg); outline:none; font-size:15px; }
  .hsub input:focus { border-color:var(--accent); }
  .hsub input::placeholder { color:var(--faint); }
  .hsub button { flex:none; height:44px; border:0; border-radius:10px; background:var(--ink); color:var(--bg); font-weight:700; padding:0 18px; cursor:pointer; white-space:nowrap; }
  .hsub button:disabled { opacity:.55; cursor:default; }
  .hsub-toggle { display:none; height:40px; padding:0 14px; border:1.5px solid var(--field); border-radius:999px; background:var(--bg); font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; }
  .hsub-toggle[aria-expanded="true"] { border-color:var(--accent); color:var(--accent); }
  .hnote { flex-basis:100%; margin:-4px 0 0; font-size:13px; color:var(--muted); text-align:right; }
  .hnote a { color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
  .hnote.status { color:var(--ink); font-size:14px; }
  @media (max-width:1080px) {
    #viewTag .top .search { flex:1 1 200px; max-width:none; }
    .hsub-toggle { display:inline-flex; align-items:center; }
    .hsub { display:none; flex:1 1 100%; order:4; }
    .hsub.open { display:flex; }
    .hnote { order:5; text-align:left; margin:0; }
  }
  .lang { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--faint); white-space:nowrap; }
  .lang a { font-weight:600; } .lang a:hover { color:var(--accent); }
  .lang a[aria-current] { color:var(--ink); }

  /* 搜索框 */
  .search { position:relative; }
  .search form { display:flex; gap:10px; }
  .search input { flex:1; min-width:0; height:54px; padding:0 18px; border:1.5px solid var(--field); border-radius:12px; background:var(--bg); outline:none; font-size:16px; }
  .search input:focus { border-color:var(--accent); }
  .search input::placeholder { color:var(--faint); }
  .search .go { flex:none; border:0; border-radius:12px; background:var(--btn); color:#fff; font-weight:700; padding:0 28px; cursor:pointer; }
  .top .search input { height:44px; border-radius:10px; font-size:15px; }
  .top .search .go { border-radius:10px; padding:0 20px; }
  .suggest { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:5; margin:0; padding:6px 0; list-style:none; background:var(--bg);
             border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 34px var(--shadow); }
  .suggest li { padding:10px 18px; cursor:pointer; display:flex; justify-content:space-between; gap:12px; }
  .suggest li[aria-selected="true"], .suggest li:hover { background:var(--chip); }
  .suggest small { color:var(--faint); font-size:13px; white-space:nowrap; }

  /* 标签按钮 */
  .chips { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0; padding:0; list-style:none; }
  .chips .lead { font-size:14px; color:var(--faint); margin-right:4px; }
  .chips a { display:inline-block; padding:7px 14px; border-radius:999px; background:var(--chip); font-size:14px; font-weight:600; }
  .chips a:hover { color:var(--accent); }

  /* 首页：上半部分 */
  .hero { display:flex; flex-wrap:wrap; align-items:center; gap:48px; padding:64px 0 56px; }
  .hero-text { flex:1 1 480px; min-width:0; display:flex; flex-direction:column; gap:24px; }
  .hero h1 { margin:0; font:700 54px/1.2 var(--serif); letter-spacing:-.01em; }
  .hero h1 mark { background:var(--hl); color:var(--accent); padding:0 8px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .hero p { margin:0; font-size:18px; line-height:1.7; color:var(--muted); max-width:520px; }
  .hero .search { max-width:560px; }
  .collage { flex:1 1 400px; min-width:0; position:relative; height:440px; }
  .collage .stripes { position:absolute; top:24px; right:10px; width:76%; height:380px; border-radius:34px; transform:rotate(6deg);
                      background:repeating-linear-gradient(115deg, var(--btn) 0 14px, #3730A3 14px 22px); }
  .collage .card { position:absolute; top:64px; right:56px; width:62%; height:290px; border-radius:26px; background:#fff; color:#1B1A2E;
                   box-shadow:0 24px 60px var(--shadow); padding:20px; display:flex; flex-direction:column; gap:10px; }
  .collage .card:hover strong { color:#4338CA; }
  .collage .card .img { flex:1; min-height:0; background:#fff; border:1px solid #ECEBF3; border-radius:16px; display:flex; align-items:center; justify-content:center; padding:12px; }
  .collage .card img { max-width:100%; max-height:100%; object-fit:contain; }
  .collage .card small { font-size:13px; font-weight:600; color:#6B6985; }
  .collage .card strong { font-size:15px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .collage .bubble { position:absolute; top:-30px; left:50%; transform:translateX(-50%); white-space:nowrap; background:#E6E3FF; color:#4338CA; font-weight:800; font-size:20px; padding:10px 18px; border-radius:14px; }
  .collage .mini { position:absolute; bottom:0; left:0; width:240px; background:#fff; color:#1B1A2E; border-radius:18px; box-shadow:0 18px 44px var(--shadow);
                   padding:14px 16px; display:flex; gap:12px; align-items:center; }
  .collage .mini img { width:56px; height:56px; object-fit:contain; flex:none; }
  .collage .mini span { display:flex; flex-direction:column; min-width:0; }
  .collage .mini small { font-size:12px; color:#6B6985; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .collage .mini b { font-size:18px; }
  .collage .mini:hover b { color:#4338CA; }
  /* 左下角：钥匙扣样式。每张卡片左边有个圆孔，后面的候选卡片绕着这个孔往上转开 */
  .collage .card { z-index:1; }                                  /* 转开的卡片藏到大卡片下面 */
  .collage .stack { position:absolute; bottom:0; left:0; width:240px; }
  .collage .stack .mini { position:relative; z-index:2; padding-left:44px; transform-origin:22px 50%; }
  .collage .stack .mini::before { content:""; position:absolute; left:15px; top:50%; width:14px; height:14px; margin-top:-7px; border-radius:50%;
                                  background:var(--bg); box-shadow:inset 0 2px 3px rgba(27,26,46,.28); }
  .collage .stack .back { position:absolute; inset:0; z-index:0; border:1px solid #DCD9EC; box-shadow:0 8px 22px var(--shadow); pointer-events:none; }
  .collage .stack .back > * { visibility:hidden; }
  .collage .stack .back.d1 { transform:rotate(-8deg); background:#F4F3FA; }
  .collage .stack .back.d2 { transform:rotate(-16deg); background:#E9E7F5; }
  .collage .stack .back.d3 { transform:rotate(-24deg); background:#DEDBEF; }
  .collage .stack .mini.enter-next { animation:swingIn .45s ease; }
  .collage .stack .mini.enter-prev { animation:swingIn .45s ease; }
  @keyframes swingIn { from { transform:rotate(-8deg); opacity:.4; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .collage .stack .mini.enter-next, .collage .stack .mini.enter-prev { animation:none; } }
  /* 轮播：左右箭头 + 切换动画 */
  .collage .nav { position:absolute; top:187px; z-index:2; width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
                  background:var(--bg); color:var(--ink); box-shadow:0 8px 22px var(--shadow); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .collage .nav:hover { color:var(--accent); border-color:var(--accent); }
  .collage .nav svg { width:18px; height:18px; }
  .collage .prev { left:calc(38% - 78px); }
  .collage .next { right:34px; }
  .collage .enter-next { animation:slideNext .35s ease; }
  .collage .enter-prev { animation:slidePrev .35s ease; }
  @keyframes slideNext { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:none; } }
  @keyframes slidePrev { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .collage .enter-next, .collage .enter-prev { animation:none; } }

  .facts-band { border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--band); }
  .facts-band .wrap { display:flex; flex-wrap:wrap; justify-content:space-around; gap:10px 40px; padding-top:20px; padding-bottom:20px; font-size:15px; color:var(--muted); }
  .facts-band b { color:var(--ink); font-size:18px; }

  .sec-head { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px; margin:52px 0 24px; }
  .sec-head h2 { margin:0; font:700 34px/1.2 var(--serif); }
  .sec-head span { font-size:14px; color:var(--faint); }

  /* 首页：精选卡片 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:26px 22px; }
  .card-deal { display:flex; flex-direction:column; gap:14px; }
  .card-deal .pic { position:relative; aspect-ratio:4 / 3; min-height:0; overflow:hidden; background:var(--tile); border:1px solid var(--tileline); border-radius:20px; display:flex; align-items:center; justify-content:center; padding:26px 26px 58px; }
  .card-deal .pic img { width:100%; height:100%; object-fit:contain; }
  .card-deal .price-chip { position:absolute; left:16px; bottom:16px; background:#fff; color:#4338CA; font-weight:800; font-size:18px; padding:6px 12px; border-radius:10px;
                           box-shadow:0 6px 16px rgba(27,26,46,.10); font-variant-numeric:tabular-nums; }
  .card-deal .body { display:flex; flex-direction:column; gap:6px; padding:0 4px; }
  .card-deal .kicker { font-size:13px; font-weight:600; color:var(--accent); }
  .card-deal .t { font-size:17px; font-weight:600; line-height:1.4; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card-deal:hover .t { color:var(--accent); }
  .card-deal .price-inline { display:none; }
  .meta { font-size:13px; color:var(--faint); }
  .pin { color:var(--accent); font-weight:600; }
  .icon { color:#A3A0C2; }

  /* 标签页 */
  .tag-head { display:flex; flex-direction:column; gap:12px; padding:44px 0 0; }
  .tag-head .eyebrow { font-size:14px; font-weight:600; color:var(--accent); }
  .tag-head h1 { margin:0; font:700 52px/1.15 var(--serif); }
  .tag-head p { margin:0; font-size:17px; color:var(--muted); }
  .sub { margin:30px 0 0; background:var(--hl); border-radius:20px; padding:22px 26px; display:flex; flex-wrap:wrap; align-items:center; gap:14px 18px; }
  .sub .label { flex:1 1 220px; font-weight:700; font-size:17px; }
  .sub input[type=email] { flex:1 1 240px; min-width:0; border:0; border-radius:10px; padding:0 14px; height:48px; background:var(--bg); outline:none; font-size:15px; }
  .sub input[type=email]:focus { box-shadow:0 0 0 2px var(--accent); }
  .seg { display:flex; background:var(--bg); border-radius:10px; padding:4px; border:0; margin:0; min-width:0; }
  .seg label { position:relative; }
  .seg input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .seg span { display:flex; align-items:center; min-height:40px; padding:0 14px; border-radius:8px; font-size:14px; font-weight:600; white-space:nowrap; }
  .seg input:checked + span { background:var(--btn); color:#fff; }
  .seg input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
  .sub .dark { border:0; border-radius:10px; background:var(--ink); color:var(--bg); font-weight:700; padding:0 24px; min-height:48px; cursor:pointer; }
  .sub .msg { flex-basis:100%; margin:0; font-size:14px; }
  .sub .fine { flex-basis:100%; margin:0; font-size:13px; color:var(--muted); }
  .sub .fine a { color:var(--accent); text-decoration:underline; text-underline-offset:2px; }

  .rank-list { margin:30px 0 0; border:1px solid var(--line); border-radius:20px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:18px; padding:16px 22px; border-bottom:1px solid var(--line2); }
  .row:last-child { border-bottom:0; }
  .row.first { background:var(--first); }
  .row .no { width:34px; flex:none; text-align:center; font:700 26px/1 var(--serif); color:var(--rank); }
  .row .no.hi { color:var(--accent); }
  .thumb { width:80px; height:80px; flex:none; background:var(--tile); border:1px solid var(--tileline); border-radius:12px; display:flex; align-items:center; justify-content:center; padding:8px; }
  .thumb img { width:100%; height:100%; object-fit:contain; }
  .row .info { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
  .row .t { font-size:16px; font-weight:600; line-height:1.35; overflow-wrap:anywhere; }
  .row:hover .t { color:var(--accent); }
  .row .money { flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:2px; min-width:110px; text-align:right; }
  .row .big { font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .row.first .big { color:var(--accent); }
  .row .small { font-size:13px; color:var(--faint); white-space:nowrap; }
  /* 过期的优惠：灰色、划线，左上角标"已过期" */
  .row { position:relative; }
  .row.expired { background:var(--tile); }
  .row.expired .thumb { filter:grayscale(1); opacity:.55; }
  .row.expired .t, .row.expired .big, .row.expired .money-inline { color:var(--faint); text-decoration:line-through; text-decoration-thickness:1.5px; }
  .row.expired .meta, .row.expired .small { color:var(--faint); }
  .row.expired:hover .t { color:var(--muted); }
  .exp-badge { position:absolute; top:6px; left:10px; z-index:1; padding:2px 7px; border-radius:6px; background:#6B6985; color:#fff;
               font-size:11px; font-weight:700; line-height:1.4; letter-spacing:.02em; text-transform:uppercase; }

  /* 搜索没有结果时的提示 */
  .miss { margin:18px 0 0; padding:18px 20px; border:1px solid var(--line); border-radius:16px; background:var(--band); max-width:620px; }
  .miss p { margin:0 0 10px; }
  .miss .chips { margin:0 0 14px; }
  .miss .hint { color:var(--muted); font-size:14px; margin:10px 0 0; }
  .primary { background:var(--btn); color:#fff; border:0; border-radius:999px; padding:10px 22px; font-weight:700; cursor:pointer; }
  .primary:disabled { opacity:.55; cursor:default; }

  .empty { padding:48px 0; color:var(--muted); }
  .empty strong { display:block; color:var(--ink); font-size:18px; margin-bottom:6px; }
  footer { border-top:1px solid var(--line); margin-top:64px; }
  footer .wrap { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 24px; padding-top:26px; padding-bottom:40px; font-size:14px; color:var(--faint); }
  footer a:hover { color:var(--accent); }
  footer .links { display:flex; gap:20px; flex-wrap:wrap; }

  @media (max-width:760px) {
    .wrap { padding:0 16px; }
    .top .wrap { gap:10px 14px; padding-top:10px; padding-bottom:10px; }
    .logo { font-size:23px; }
    #viewTag .top .hsub-toggle { margin-left:auto; }
    #viewTag .top .search { flex-basis:100%; order:3; }
    .hero { padding:32px 0 28px; gap:22px; }
    .hero-text { gap:18px; }
    .hero h1 { font-size:36px; line-height:1.25; }
    .hero p { font-size:15px; }
    .hero .search form { flex-direction:column; }
    .hero .search input { flex:none; height:52px; }
    .hero .search .go { min-height:50px; }
    .collage { display:none; }
    .facts-band .wrap { justify-content:space-between; gap:8px 16px; font-size:13px; }
    .facts-band .src { display:none; }
    .sec-head { margin:30px 0 18px; }
    .sec-head h2 { font-size:26px; }
    .grid { grid-template-columns:1fr; gap:0; }
    .card-deal { flex-direction:row; gap:14px; align-items:center; padding:0 0 16px; margin-bottom:16px; border-bottom:1px solid var(--line2); }
    .card-deal .pic { width:104px; height:104px; aspect-ratio:auto; flex:none; padding:10px; border-radius:14px; }
    .card-deal .price-chip { display:none; }
    .card-deal .price-inline { display:block; font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
    .card-deal .body { padding:0; min-width:0; gap:4px; }
    .card-deal .t { font-size:15px; }
    .tag-head { padding-top:24px; gap:8px; }
    .tag-head h1 { font-size:34px; }
    .tag-head p { font-size:14px; }
    .sub { flex-direction:column; align-items:stretch; padding:18px; gap:10px; margin-top:20px; }
    .sub .label { flex:none; font-size:16px; }
    .sub input[type=email] { flex:none; font-size:16px; }
    .seg label { flex:1; } .seg span { justify-content:center; }
    .rank-list { margin:20px -16px 0; border-radius:0; border-left:0; border-right:0; }
    .row { gap:12px; padding:14px 16px; align-items:flex-start; }
    .row .no { width:22px; font-size:20px; padding-top:20px; }
    .thumb { width:64px; height:64px; padding:6px; border-radius:10px; }
    .row .t { font-size:14px; }
    .row .money { display:none; }
    .row .money-inline { display:block !important; font-size:17px; font-weight:800; }
    .row.first .money-inline { color:var(--accent); }
  }
  .row .money-inline { display:none; }
  .row .money-inline small { font-size:12px; font-weight:500; color:var(--faint); }
</style>
</head>
<body>

  <!-- 首页 -->
  <div id="viewHome" hidden>
    <header class="top"><div class="wrap">
      <a class="logo" href="./" data-home aria-label="Subdeals"><span>sub</span><b>deals</b></a>
      <span class="spacer"></span>
      <nav class="lang"></nav>
    </div></header>
    <div class="wrap">
      <section class="hero">
        <div class="hero-text">
          <h1 id="heroTitle"></h1>
          <p id="heroText"></p>
          <div class="search" id="searchHome"></div>
          <ul class="chips" id="hotTags"></ul>
          <div class="miss" id="missHome" hidden></div>
        </div>
        <section class="collage" id="collage" aria-roledescription="carousel" hidden></section>
      </section>
    </div>
    <section class="facts-band"><div class="wrap" id="facts"></div></section>
    <div class="wrap">
      <div class="sec-head"><h2 id="featuredTitle"></h2><span id="featuredNote"></span></div>
      <main id="featured" class="grid" aria-live="polite"></main>
    </div>
  </div>

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: "POST", headers: { ...HEADERS, "Content-Type": "application/json" }, body: JSON.stringify(args || {}) });
  const text = await r.text();
  if (!r.ok) { let m = text; try { m = JSON.parse(text).message || text; } catch (e) {} throw new Error(m); }
  return text ? JSON.parse(text) : null;
}

// ---------- 搜索：第 1 层联想 + 第 2 层规则拆解（都在浏览器里完成，不用 AI） ----------
let HOME = { tags: [], synonyms: [], gpus: [] };
const CAT_PRIORITY = ["laptop", "desktop", "graphics_card", "ssd", "hdd"];   // 同时出现多个品类词时，靠前的优先（"5090显卡的笔记本"是笔记本）
const FILLERS = ["的", "游戏", "电脑", "优惠", "便宜", "最低价", "低价", "价格", "排行", "内存", "版", "款", "带", "配", "和", "个", "台",
                 "gaming", "deals", "deal", "with", "geforce", "nvidia", "rtx", "英伟达", "best", "cheap", "price", "pc"];
// 统一格式：全角转半角、转小写、去掉空格和标点
const norm = s => String(s || "").normalize("NFKC").toLowerCase().replace(/[\s\p{P}\p{S}]+/gu, "");

function parseQuery(raw) {
  let s = String(raw || "").normalize("NFKC").toLowerCase();
  const out = { category: null, gpu: null, capacity: null, ram: null, ok: false, clean: false };
  // 显卡型号：5090、rtx5080、5070 ti
  const g = s.match(/(?:rtx|geforce)?\s*(50[5-9]0)\s*(ti(?![a-z]))?/);
  if (g) {
    const name = "RTX " + g[1] + (g[2] ? " Ti" : "");
    if (HOME.gpus.includes(name)) { out.gpu = name; s = s.replace(g[0], "|"); }
  }
  // 容量：20tb、4t、1.5 tb
  const c = s.match(/(\d+(?:\.\d+)?)\s*(?:tb|t)(?![a-z])/);
  if (c) { out.capacity = Number(c[1]); s = s.replace(c[0], "|"); }
  // 内存：32g、64gb（第二阶段做筛选时用，现在只是识别出来，不影响标签）
  const m = s.match(/(\d+)\s*(?:gb|g)(?![a-z])/);
  if (m) { out.ram = Number(m[1]); s = s.replace(m[0], "|"); }
  s = s.replace(/\s+/g, "");
  // 品类：用同义词表，长的词先匹配（"固态硬盘"先于"硬盘"）
  const cats = new Set();
  for (const syn of [...HOME.synonyms].sort((a, b) => b.term.length - a.term.length)) {
    if (s.includes(syn.term)) { cats.add(syn.category); s = s.split(syn.term).join(" "); }
  }
  out.category = CAT_PRIORITY.find(k => cats.has(k)) || null;
  // 剩下的字：去掉没有意义的词以后，如果还有实在的内容，说明规则没看懂，交给后面处理
  for (const f of FILLERS) s = s.split(f).join(" ");
  const rest = s.replace(/[\p{P}\p{S}]+/gu, " ");
  out.clean = !/[一-鿿]{2,}|[a-z0-9]{3,}/.test(rest);
  if (out.category && ["laptop", "desktop", "graphics_card"].includes(out.category)) out.capacity = null;
  if (out.category && ["ssd", "hdd"].includes(out.category)) out.gpu = null;
  out.ok = !!out.category && out.clean;
  return out;
}

function suggestions(raw) {
  const n = norm(raw);
  if (!n) return [];
  const p = parseQuery(raw);
  const hasParts = p.category || p.gpu || p.capacity;
  const typing = new Set(HOME.synonyms.filter(x => x.term.startsWith(n)).map(x => x.category));   // 品类词打到一半，比如"笔记"
  const apple = appleMatch(raw);
  if (apple) return (apple.exact ? [apple.exact, ...apple.tags.filter(t => t !== apple.exact)] : apple.tags).slice(0, 6);
  const scored = [];
  for (const t of HOME.tags) {
    const texts = [t.name, t.name_en, t.slug, ...(t.aliases || [])].map(norm);
    let score = 0;
    if (texts.includes(n)) score = 3;
    else if (texts.some(x => x && x.includes(n))) score = 1;
    if (!score && hasParts && t.kind === "structured") {
      const fits = (!p.category || t.category === p.category) && (!p.gpu || t.gpu === p.gpu) && (!p.capacity || Number(t.capacity_tb) === p.capacity);
      const exact = t.category === p.category && (t.gpu || null) === p.gpu && (t.capacity_tb == null ? null : Number(t.capacity_tb)) === p.capacity;
      if (exact && p.clean) score = 3; else if (fits) score = 1;
    }
    if (!score && t.kind === "structured" && typing.has(t.category)) score = 1;
    if (score) scored.push([score, t]);
  }
  if (!scored.length && p.category) {                  // 没有完全对得上的（比如 20TB 硬盘还没有标签），就推荐这个品类的标签
    for (const t of HOME.tags) if (t.kind === "structured" && t.category === p.category && !t.gpu && t.capacity_tb == null) scored.push([1, t]);
  }
  scored.sort((a, b) => b[0] - a[0] || b[1].heat - a[1].heat || b[1].deals - a[1].deals);
  return scored.slice(0, 5).map(x => x[1]);
}

// 搜索框（首页和标签页各一个，共用这段代码）
function mountSearch(el, missEl) {
  el.innerHTML = `<form role="search" autocomplete="off">
      <input type="search" enterkeyhint="search" aria-label="${esc(T.searchBtn)}" placeholder="${esc(T.placeholder)}" maxlength="60"
             role="combobox" aria-expanded="false" aria-autocomplete="list">
      <button class="go" type="submit">${esc(T.searchBtn)}</button>
    </form><ul class="suggest" role="listbox" hidden></ul>`;
  const input = el.querySelector("input"), list = el.querySelector(".suggest");
  let items = [], active = -1;
  const close = () => { list.hidden = true; el.classList.remove("open"); input.setAttribute("aria-expanded", "false"); active = -1; };
  const draw = () => {
    items = suggestions(input.value);
    if (!items.length) return close();
    list.innerHTML = items.map((t, i) => `<li role="option" data-i="${i}" aria-selected="${i === active}"><span>${esc(tagName(t))}</span>${t.deals ? `<small>${esc(T.dealsCount(t.deals))}</small>` : ""}</li>`).join("");
    list.hidden = false; el.classList.add("open"); input.setAttribute("aria-expanded", "true");
  };
  input.addEventListener("input", () => { active = -1; missEl.hidden = true; draw(); });
  input.addEventListener("focus", draw);
  input.addEventListener("keydown", e => {
    if (list.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length + 1) % (items.length + 1);
      if (active === items.length) active = -1;
      draw();
    } else if (e.key === "Escape") close();
  });
  list.addEventListener("mousedown", e => {          // mousedown 先于输入框失去焦点
    const li = e.target.closest("li"); if (!li) return;
    e.preventDefault(); const t = items[Number(li.dataset.i)]; close(); openTag(t.slug, input.value);
  });
  input.addEventListener("blur", () => setTimeout(close, 120));
  el.querySelector("form").addEventListener("submit", async e => {
    e.preventDefault();
    const raw = input.value.trim(); if (!raw) return;
    const picked = active >= 0 ? items[active] : null;
    close(); input.blur();
    if (picked) return openTag(picked.slug, raw);
    await search(raw, missEl);
  });
  return input;
}

const APPLE_FAMILIES = [   // [标签 key 的开头, 怎么认出这个产品线]，从上往下认，先认到的为准
  [["mbp"], /macbook\s*pro|\bmbp/], [["mba"], /macbook\s*air|\bmba/], [["macbook-neo"], /macbook\s*neo/],
  [["mbp", "mba", "macbook-neo"], /macbook/], [["imac"], /\bimac/], [["macmini"], /mac\s*mini/], [["macstudio"], /mac\s*studio/],
  [["macpro"], /\bmac\s*pro/], [["ipadpro"], /ipad\s*pro/], [["ipadair"], /ipad\s*air/], [["ipadmini"], /ipad\s*mini/],
  [["ipad-", "ipadpro", "ipadair", "ipadmini"], /ipad/], [["iphone-"], /iphone/], [["watch-"], /apple\s*watch|\bwatch/], [["airpods-"], /airpods/],
];
const APPLE_FILLERS = new Set(["apple", "苹果", "series", "系列", "laptop", "笔记本", "chip", "芯片", "new", "新款", "款", "的", "unlocked", "inch", "in", "gen", "generation", "2024", "2025", "2026"]);
function appleTokens(text) {
  const s = String(text || "").normalize("NFKC").toLowerCase()
    .replace(/(mbp|mba|iphone|airpods|ultra|series|se)(\d)/g, "$1 $2").replace(/(m\d)(pro|max|ultra)/g, "$1 $2")
    .replace(/(\d)(pro|max|plus)/g, "$1 $2").replace(/寸|吋|英寸|"|”/g, " ");
  return s.split(/[^a-z0-9.\u4e00-\u9fff]+/).filter(w => w && !APPLE_FILLERS.has(w) && !/^\d+(gb|tb|g|t)$/.test(w));
}
// 返回 { family: 认到的产品线, tags: 对得上的苹果标签, exact: 唯一确定的标签 }；不是苹果产品返回 null
function appleMatch(raw) {
  const q = String(raw || "").normalize("NFKC").toLowerCase();
  const fam = APPLE_FAMILIES.find(([, re]) => re.test(q));
  if (!fam) return null;
  const want = appleTokens(q.replace(fam[1], " "));
  const all = HOME.tags.filter(t => t.apple_model && fam[0].some(p => t.apple_model.startsWith(p)));
  let tags = all.filter(t => { const have = new Set(appleTokens([t.name, ...(t.aliases || [])].join(" "))); return want.every(w => have.has(w)); });
  // 没写 OLED 时，认定型号只在非 OLED 款里找；列表里 OLED 款照样列出来
  const pick = !want.includes("oled") && tags.some(t => !t.apple_model.endsWith("-oled")) ? tags.filter(t => !t.apple_model.endsWith("-oled")) : tags;
  const nameTokens = t => appleTokens(t.name.toLowerCase().replace(fam[1], " "));
  const exact = pick.length === 1 ? pick[0] : pick.find(t => { const n = nameTokens(t); return n.length === want.length && n.every(w => want.includes(w)); });
  // 排序：新芯片在前，同一代按尺寸从小到大，OLED 在后；没有 M 芯片的（Intel、iPhone 等）按名字排在后面
  const order = t => { const m = t.apple_model.match(/^([a-z-]+?)(\d*)-m(\d)(-oled)?$/); return m ? [0, -Number(m[3]), Number(m[2] || 0), m[4] ? 1 : 0] : [1, t.name, 0, 0]; };
  const cmp = (a, b) => { const x = order(a), y = order(b); for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1; return 0; };
  return { tags: tags.sort(cmp), all: all.sort(cmp), exact: want.length || pick.length === 1 ? exact : null };
}
// 苹果型号没确定时：列出这个产品线的型号让人点
function showAppleChooser(raw, a, missEl) {
  const list = a.tags.length ? a.tags : a.all;
  missEl.innerHTML = `<p><strong>${esc(a.tags.length ? T.appleChoose : T.appleNone(raw))}</strong></p>
    <ul class="chips">${list.map(t => `<li><a href="${tagHref(t.slug)}" data-slug="${esc(t.slug)}">${esc(tagName(t))}</a></li>`).join("")}</ul>`;
  missEl.hidden = false;
}

async function search(raw, missEl) {
  await homeReady;                                   // 等标签和同义词加载完
  const n = norm(raw);
  // 第 1 层：和某个标签的名字或别名完全一样
  const exact = HOME.tags.find(t => [t.name, t.name_en, ...(t.aliases || [])].map(norm).includes(n));
  if (exact) return openTag(exact.slug, raw);
  // 苹果产品：按型号找，找不准就让人选，不新建标签
  const apple = appleMatch(raw);
  if (apple) {
    if (apple.exact) return openTag(apple.exact.slug, raw);
    rpc("public_log_miss", { p_query: n, p_visitor: visitorId() }).catch(() => {});
    return showAppleChooser(raw, apple, missEl);
  }
  // 第 2 层：规则拆解
  const p = parseQuery(raw);
  if (p.ok) {
    const known = HOME.tags.find(t => t.kind === "structured" && t.category === p.category && (t.gpu || null) === p.gpu
                                      && (t.capacity_tb == null ? null : Number(t.capacity_tb)) === p.capacity);
    if (known) return openTag(known.slug, raw);
    try {
      const slug = await rpc("public_resolve_tag", { p_category: p.category, p_gpu: p.gpu, p_capacity_tb: p.capacity });
      if (slug) return openTag(slug, raw);
    } catch (e) { return showMiss(raw, missEl, e.message); }
  }
  // 都没匹配上：显示相关标签和"新建标签"按钮
  rpc("public_log_miss", { p_query: n, p_visitor: visitorId() }).catch(() => {});
  showMiss(raw, missEl);
}

function showMiss(raw, missEl, errorText) {
  const related = suggestions(raw);
  missEl.innerHTML = `<p><strong>${esc(T.missTitle(raw))}</strong></p>
    ${related.length ? `<p>${esc(T.missRelated)}</p><ul class="chips">${related.map(t => `<li><a href="${tagHref(t.slug)}" data-slug="${esc(t.slug)}">${esc(tagName(t))}</a></li>`).join("")}</ul>` : ""}
    <button class="primary" type="button">${esc(T.createBtn(raw))}</button>
    <p class="hint" role="status">${esc(errorText || T.createHint)}</p>`;
  missEl.hidden = false;
  const btn = missEl.querySelector("button"), hint = missEl.querySelector(".hint");
  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = T.creating;
    try {
      // 第 3 层：只有点了这个按钮才会用到 AI（在服务器上运行）
      const r = await fetch(`${SUPABASE_URL}/functions/v1/create-tag`, { method: "POST", headers: { ...HEADERS, "Content-Type": "application/json" }, body: JSON.stringify({ query: raw }) });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.slug) { missEl.hidden = true; return openTag(d.slug, raw); }
      hint.textContent = d.error === "limited" ? T.errLimited : d.error === "not_product" ? T.errNotProduct : T.errServer;
    } catch (e) { hint.textContent = T.errServer; }
    btn.disabled = false; btn.textContent = T.createBtn(raw);
  });
}

// 合并重复：同一商家、价格相差 2% 以内、标题相似的，只保留最新的一条
function titleWords(t) { return new Set(cleanTitle(t).toLowerCase().split(/[^a-z0-9一-鿿]+/).filter(w => w.length > 1)); }
function similar(a, b) {
  const A = titleWords(a), B = titleWords(b); if (!A.size || !B.size) return 0;
  let both = 0; for (const w of A) if (B.has(w)) both++;
  return both / (A.size + B.size - both);
}
// 同品牌、同型号、同价格（四舍五入到整美元）的 deal 只留一条：留排在前面的那条。后台可以关掉这条规则
const MODEL_STOP = new Set(("graphics card video gpu desktop laptop gaming pc computer internal external ssd hdd hard drive new the with and or "
  + "for of in on at w free shipping less plus after coupon code clip deal deals sale price prime amazon newegg walmart bestbuy best buy "
  + "ebay woot bh b h microcenter micro center target costco").split(" "));
function modelTokens(title) {
  return new Set(String(title || "").toLowerCase().replace(/\$\s?[\d,]+(\.\d+)?/g, " ").replace(/[^a-z0-9]+/g, " ")
    .split(" ").filter(w => w && !MODEL_STOP.has(w)));
}
const same = (a, b) => String(a ?? "").toLowerCase() === String(b ?? "").toLowerCase();
function sameModel(a, b) {
  if (!a.brand || !same(a.brand, b.brand)) return false;
  if (!["category", "gpu", "apple_model", "condition"].every(k => same(a[k], b[k]))) return false;
  if (Number(a.capacity_tb || 0) !== Number(b.capacity_tb || 0) || Number(a.quantity || 1) !== Number(b.quantity || 1)) return false;
  const A = modelTokens(a.title), B = modelTokens(b.title);
  const [small, big] = A.size <= B.size ? [A, B] : [B, A];
  return small.size >= 2 && [...small].every(w => big.has(w));
}
function mergeSame(list, on) {
  if (!on) return list;
  const kept = [];
  for (const d of list) {
    if (!kept.some(k => Math.round(k.price) === Math.round(d.price) && sameModel(k, d))) kept.push(d);
  }
  return kept;
}

function dedupe(list) {
  const kept = [];
  for (const d of [...list].sort((a, b) => new Date(b.created_at) - new Date(a.created_at))) {
    const dup = kept.some(k => norm(k.store) === norm(d.store) && Math.abs(k.price - d.price) / Math.max(k.price, d.price) <= 0.02 && similar(k.title, d.title) >= 0.6);
    if (!dup) kept.push(d);
  }
  return list.filter(d => kept.includes(d));
}

// 右边的轮播：精选里有图片的优惠，自动循环（鼠标放上去或键盘操作时暂停），左右箭头手动切换，点卡片打开优惠
const CAROUSEL_MS = 4500;
let slides = [], slideAt = 0, slideTimer = null, slidePaused = false;
function renderCollage(rows) {
  slides = rows.filter(d => /^https:\/\//.test(d.image_url || ""));
  if (!slides.length) return;
  const box = $("collage");
  const arrow = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  box.setAttribute("aria-label", T.carousel);
  box.innerHTML = `<div class="stripes"></div><div id="slideCard"></div><div id="slideMini"></div>
    ${slides.length > 1 ? `<button class="nav prev" type="button" aria-label="${esc(T.prevDeal)}">${arrow("M15 18l-6-6 6-6")}</button>
    <button class="nav next" type="button" aria-label="${esc(T.nextDeal)}">${arrow("M9 18l6-6-6-6")}</button>` : ""}`;
  box.hidden = false;
  if (slides.length > 1) {
    box.querySelector(".prev").addEventListener("click", () => { showSlide(slideAt - 1, "prev"); restartSlides(); });
    box.querySelector(".next").addEventListener("click", () => { showSlide(slideAt + 1, "next"); restartSlides(); });
    box.addEventListener("mouseenter", () => { slidePaused = true; });
    box.addEventListener("mouseleave", () => { slidePaused = false; });
    box.addEventListener("focusin", () => { slidePaused = true; });
    box.addEventListener("focusout", () => { slidePaused = false; });
  }
  showSlide(0);
  restartSlides();
}
function showSlide(i, dir) {
  const n = slides.length;
  slideAt = ((i % n) + n) % n;
  const a = slides[slideAt], b = n > 1 ? slides[(slideAt + 1) % n] : null, cat = d => T.categories[d.category] || "";
  const anim = dir ? ` enter-${dir}` : "";
  const link = d => `href="${esc(d.url)}" target="_blank" rel="noopener" title="${esc(d.title)}"`;
  $("slideCard").innerHTML = `<a class="card${anim}" ${link(a)}>
      <span class="bubble">${money(a.price)}</span>
      <div class="img"><img src="${esc(a.image_url)}" alt="" referrerpolicy="no-referrer"></div>
      <small>${esc(cat(a))}</small><strong>${esc(cleanTitle(a.title))}</strong></a>`;
  // 左下角：下一条在最前面，再后面的候选（最多 3 张）绕着左边的圆孔转开
  const inner = d => `<img src="${esc(d.image_url)}" alt="" referrerpolicy="no-referrer"><span><small>${esc(cat(d))}</small><b>${money(d.price)}</b></span>`;
  const depth = Math.min(n - 2, 3);
  const backs = Array.from({ length: Math.max(depth, 0) }, (_, k) => depth - k)
    .map(k => `<div class="mini back d${k}" aria-hidden="true">${inner(slides[(slideAt + 1 + k) % n])}</div>`).join("");
  $("slideMini").innerHTML = b ? `<div class="stack">${backs}<a class="mini${anim}" ${link(b)}>${inner(b)}</a></div>` : "";
  if (n > 2) { const img = new Image(); img.referrerPolicy = "no-referrer"; img.src = slides[(slideAt + 2) % n].image_url; }   // 先加载下一张
}
function restartSlides() {
  clearInterval(slideTimer);
  if (slides.length < 2 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;   // 系统设置了减少动画就不自动播放
  slideTimer = setInterval(() => {
    if (!slidePaused && !document.hidden && !$("viewHome").hidden) showSlide(slideAt + 1, "next");
  }, CAROUSEL_MS);
}
function renderHotTags() {
  const tags = HOME.tags.filter(t => t.deals > 0 || t.heat > 0).slice(0, HOT_TAGS);
  $("hotTags").innerHTML = (tags.length ? `<li class="lead">${esc(T.hotLead)}</li>` : "")
    + tags.map(t => `<li><a href="${tagHref(t.slug)}" data-slug="${esc(t.slug)}">${esc(tagName(t))}</a></li>`).join("");
  renderFacts();
}

let tagRequest = 0;
async function showTag(slug, query) {
  $("viewHome").hidden = true; $("viewTag").hidden = false; $("missTag").hidden = true;
  drawLang();
  window.scrollTo(0, 0);
  const body = $("tagBody"), mine = ++tagRequest;
  setHeaderSub(null);
  body.innerHTML = `<div class="empty">${esc(T.loading)}</div>`;
  let data;
  try { data = await rpc("public_tag_deals", { p_slug: slug, p_visitor: visitorId(), p_query: query ? norm(query) : null }); }
  catch (e) { if (mine === tagRequest) body.innerHTML = `<div class="empty"><strong>${esc(T.loadError)}</strong>${esc(T.loadErrorHint)}</div>`; return; }
  if (mine !== tagRequest) return;
  if (!data) {
    await homeReady;
    const apple = appleMatch(slug.replace(/-/g, " "));     // 旧的苹果标签链接（比如 ?t=macbook-pro）：列出型号让人选
    if (apple) { body.innerHTML = `<div class="miss"></div>`; return showAppleChooser(slug.replace(/-/g, " "), apple, body.firstChild); }
    body.innerHTML = `<div class="empty"><strong>${esc(T.tagNotFound)}</strong>${esc(T.tagNotFoundHint)} <a href="./" data-home>${esc(T.backHome)}</a></div>`;
    return;
  }
  // 过期的优惠排到最后（变灰、划线、不算名次），合并重复时优先留没过期的那条
  const ordered = [...data.deals.filter(d => !d.expired_at), ...data.deals.filter(d => d.expired_at)];
  const tag = data.tag, name = tagName(tag), deals = dedupe(mergeSame(ordered, data.merge_same !== false));
  if (tag.slug !== slug) { history.replaceState({}, "", tagHref(tag.slug)); drawLang(); }   // 被合并的旧网址跳到新标签
  document.title = T.pageTitle(name);
  tagInput.value = name;
  const intro = !deals.length ? "" : tag.kind === "keyword" ? T.rankKeyword(deals.length) : tag.per_tb ? T.rankPerTb(deals.length) : T.rankTotal(deals.length);
  const isNew = Date.now() - new Date(tag.created_at || 0) < 2 * 86400000;
  const eyebrow = [T.categories[tag.category] || "", tag.kind === "keyword" ? "" : tag.per_tb ? T.sortPerTb : T.sortTotal].filter(Boolean).join(" · ");
  body.innerHTML = `
    <div class="tag-head">${eyebrow ? `<span class="eyebrow">${esc(eyebrow)}</span>` : ""}<h1>${esc(name)}</h1>${intro ? `<p>${esc(intro)}</p>` : ""}</div>
    <form class="sub" id="subForm" novalidate>
      <span class="label">${esc(T.subTitle)}</span>
      <input type="email" name="email" placeholder="${esc(T.subEmail)}" aria-label="${esc(T.subEmail)}" autocomplete="email">
      <fieldset class="seg"><legend class="sr">${esc(T.subFreq)}</legend>
        <label><input type="radio" name="frequency" value="daily" checked><span>${esc(T.subDaily)}</span></label>
        <label><input type="radio" name="frequency" value="instant"><span>${esc(T.subInstant)}</span></label>
      </fieldset>
      <button class="dark" type="submit">${esc(T.subBtn)}</button>
      <p class="msg" role="status" hidden></p>
      <p class="fine">${esc(T.subPrivacy[0])}<a href="${PRIVACY_URL}">${esc(T.subPrivacy[1])}</a>${esc(T.subPrivacy[2])}</p>
    </form>
    ${deals.length
      ? `<div class="rank-list">${deals.map((d, i) => rowHtml(d, i, { showCategory: tag.kind === "keyword" })).join("")}</div>`
      : `<div class="empty"><strong>${esc(T.tagEmpty)}</strong>${esc(tag.kind === "keyword" || isNew ? T.tagEmptyNew : T.tagEmptyOld)}</div>`}`;
  $("subForm").addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target, msg = f.querySelector(".msg");
    msg.hidden = false;
    subscribe(f.email.value.trim(), f.frequency.value, t => { msg.textContent = t; }, f.querySelector("button[type=submit]"));
  });
  setHeaderSub(tag);
}

// 订阅：提交到服务器，服务器发确认邮件。say(文字) 用来显示进度和结果
async function subscribe(email, frequency, say, btn) {
  if (!CUR_TAG) return;
  const sub = { email, tag: CUR_TAG.slug, frequency, lang: LANG };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { say(T.subBadEmail); return; }
  btn.disabled = true; say(T.subSending);
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/mail/subscribe`, { method: "POST", headers: { ...HEADERS, "Content-Type": "application/json" }, body: JSON.stringify(sub) });
    const d = await r.json().catch(() => ({}));
    say(d.ok ? T.subSent(email) : d.error === "closed" ? T.subSoon : d.error === "bad_email" ? T.subBadEmail
      : d.error === "limited" ? T.subLimited : d.error === "quota" ? T.subQuota : T.subFailed);
  } catch (err) { say(T.subFailed); }
  btn.disabled = false;
}

// 标签页顶栏的订阅框：订阅当前标签，默认每天汇总。窄屏时收起，点"订阅"展开
let CUR_TAG = null;
const privacyNote = () => `${esc(T.subPrivacy[0])}<a href="${PRIVACY_URL}">${esc(T.subPrivacy[1])}</a>${esc(T.subPrivacy[2])}`;
function setHeaderSub(tag) {
  CUR_TAG = tag;
  const on = !!tag;
  $("hsub").hidden = !on; $("hsubToggle").hidden = !on;
  $("hsub").classList.remove("open"); $("hsubToggle").setAttribute("aria-expanded", "false");
  $("hnote").hidden = true;
  if (!on) return;
  const ph = T.hsubEmail(tagName(tag));
  $("hsubEmail").placeholder = ph; $("hsubEmail").setAttribute("aria-label", ph);
}
$("hsubToggle").addEventListener("click", () => {
  const open = !$("hsub").classList.contains("open");
  $("hsub").classList.toggle("open", open);
  $("hsubToggle").setAttribute("aria-expanded", String(open));
  if (open) $("hsubEmail").focus(); else $("hnote").hidden = true;
});
$("hsubEmail").addEventListener("focus", () => {
  if ($("hnote").classList.contains("status") && !$("hnote").hidden) return;
  $("hnote").className = "hnote"; $("hnote").innerHTML = privacyNote(); $("hnote").hidden = false;
});
$("hsub").addEventListener("submit", e => {
  e.preventDefault();
  subscribe($("hsubEmail").value.trim(), "daily", t => {
    $("hnote").className = "hnote status"; $("hnote").textContent = t; $("hnote").hidden = false;
  }, $("hsubBtn"));
});

// ---------- 启动 ----------
// 右上角切换语言：链接带上 ?lang=，打开后记住这个选择
function drawLang() {
  const q = new URLSearchParams(location.search);
  q.delete("lang");
  const html = [["zh", "中文"], ["en", "EN"]].map(([l, n]) => {
    const u = new URLSearchParams(q); u.set("lang", l);
    return `<a href="?${esc(u.toString())}" lang="${l === "zh" ? "zh-CN" : "en"}"${l === LANG ? ' aria-current="true"' : ""}>${n}</a>`;
  }).join("<span>/</span>");
  document.querySelectorAll(".lang").forEach(el => { el.innerHTML = html; });
}
document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
document.querySelector('meta[name="description"]').content = T.metaDesc;
$("privacyLink").textContent = T.privacy;
$("privacyLink").href = PRIVACY_URL;
document.querySelectorAll("a[data-home]").forEach(a => { a.href = "./" + (LANG_Q ? "?" + LANG_Q : ""); });
drawLang();
$("heroTitle").innerHTML = `${esc(T.heroTitle[0])}<br><mark>${esc(T.heroTitle[1])}</mark>`;
$("heroText").textContent = T.heroText;
$("hsubToggle").textContent = T.hsubToggle;
$("hsubBtn").textContent = T.subBtn;
$("status").textContent = T.priceNote;
const homeReady = rpc("public_home").then(d => { HOME = d; renderHotTags(); }).catch(() => {});
const homeInput = mountSearch($("searchHome"), $("missHome"));
const tagInput = mountSearch($("searchTag"), $("missTag"));
route();

</script>
