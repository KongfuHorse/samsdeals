<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam's Deals · 精选电脑硬件优惠</title>
<meta name="description" content="只收录低于价格线的电脑硬件优惠：游戏本、显卡、台式机、固态和机械硬盘。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&text=%E7%B2%BE%E9%80%89&display=block" rel="stylesheet">
<style>
  :root {
    --paper:#ECEFF1; --surface:#F8F9FA; --ink:#17202A; --muted:#5D6772; --faint:#8B949E;
    --line:#D3D9DE; --seal:#BE3A2E; --track:#DDE2E6;
    --num:"Archivo", "Noto Sans SC", system-ui, sans-serif;
    --text:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#111519; --surface:#181D22; --ink:#E6EAEE; --muted:#9AA3AD; --faint:#6C7580;
      --line:#2A3138; --seal:#DE5A4C; --track:#262D34;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.7 var(--text); }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:3px; border-radius:2px; }
  .wrap { max-width:760px; margin:0 auto; padding:0 20px; }

  /* 顶栏 */
  .top { display:flex; align-items:center; justify-content:space-between; padding:28px 0 0; }
  .brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
  .seal { width:34px; height:34px; display:grid; place-items:center; background:var(--seal); color:#fff;
          border-radius:5px; font:900 13px/1 "Noto Serif SC", serif; letter-spacing:.5px; writing-mode:vertical-rl;
          transform:rotate(-4deg); }
  .brand-name { font:700 19px/1 var(--num); font-stretch:112%; letter-spacing:-.2px; }
  .subscribe { font-size:14px; font-weight:500; text-decoration:none; padding:7px 14px; border:1.5px solid var(--ink); border-radius:999px; }
  .subscribe:hover { background:var(--ink); color:var(--paper); }

  /* 首屏：分数 */
  .hero { display:grid; grid-template-columns:auto 1fr; gap:36px; align-items:center; padding:72px 0 56px; }
  .ratio { font-family:var(--num); font-stretch:125%; font-weight:800; line-height:.9; text-align:center;
           font-variant-numeric:tabular-nums; min-width:150px; }
  .ratio .kept { font-size:96px; display:block; }
  .ratio .bar { display:block; height:5px; background:var(--ink); margin:12px 0 14px; border-radius:3px; }
  .ratio .seen { font-size:44px; display:block; color:var(--faint); font-weight:600; }
  .hero h1 { font-size:30px; line-height:1.35; margin:0 0 12px; font-weight:700; letter-spacing:-.3px; }
  .hero p { margin:0; color:var(--muted); max-width:30em; }

  /* 分类 */
  .filters { display:flex; gap:22px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:8px; }
  .filters button { appearance:none; background:none; border:0; padding:10px 0; margin-bottom:-1px; font:500 15px var(--text);
                    color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
  .filters button[aria-pressed="true"] { color:var(--ink); border-bottom-color:var(--ink); }
  .filters button span { font-family:var(--num); color:var(--faint); margin-left:4px; font-size:13px; }

  /* deal 列表 */
  .deal { display:grid; grid-template-columns:1fr auto; gap:6px 28px; padding:30px 0 32px; border-bottom:1px solid var(--line); }
  .deal-title { font-size:18px; font-weight:500; line-height:1.5; margin:0; }
  .deal-title a { text-decoration:none; }
  .deal-title a:hover { text-decoration:underline; text-underline-offset:3px; }
  .facts { grid-column:1; color:var(--muted); font-size:14px; display:flex; flex-wrap:wrap; gap:4px 16px; }
  .price-col { grid-column:2; grid-row:1 / span 2; text-align:right; }
  .price { font:800 34px/1 var(--num); font-stretch:115%; font-variant-numeric:tabular-nums; letter-spacing:-.5px; white-space:nowrap; }
  .price small { font-size:15px; font-weight:600; color:var(--muted); margin-left:2px; }
  .pin { color:var(--seal); font-weight:500; }

  .empty { padding:56px 0; color:var(--muted); }
  .empty strong { display:block; color:var(--ink); font-size:18px; margin-bottom:6px; }

  /* 说明 */
  .about { margin:64px 0 0; padding:32px 0 0; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(3, 1fr); gap:28px; }
  .about h2 { font-size:15px; margin:0 0 6px; }
  .about p { margin:0; font-size:14px; color:var(--muted); }
  footer { padding:40px 0 56px; color:var(--faint); font-size:13px; }

  @media (max-width:640px) {
    .hero { grid-template-columns:1fr; gap:20px; padding:48px 0 40px; }
    .ratio { text-align:left; min-width:0; display:flex; align-items:baseline; gap:12px; }
    .ratio .kept { font-size:72px; }
    .ratio .bar { width:5px; height:56px; margin:0; align-self:center; transform:skewX(-18deg); }
    .ratio .seen { font-size:40px; }
    .hero h1 { font-size:24px; }
    .deal { grid-template-columns:1fr; }
    .price-col { grid-column:1; grid-row:auto; text-align:left; margin-top:10px; }
    .about { grid-template-columns:1fr; gap:20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./" aria-label="Sam's Deals 首页"><span class="seal" aria-hidden="true">精选</span><span class="brand-name">Sam's Deals</span></a>
    <a class="subscribe" id="subscribe" href="#" target="_blank" rel="noopener">邮件订阅</a>
  </header>

  <section class="hero" aria-labelledby="heroTitle">
    <div class="ratio" id="ratio" aria-hidden="true"><span class="kept" id="kept">–</span><span class="bar"></span><span class="seen" id="seen">–</span></div>
    <div>
      <h1 id="heroTitle">大多数优惠，其实不够便宜。</h1>
      <p id="heroText">我们给每类电脑硬件定了一条价格线。只有低于这条线的优惠，才会出现在这里。</p>
    </div>
  </section>

  <nav class="filters" id="filters" aria-label="按品类筛选"></nav>
  <main id="list" aria-live="polite"><div class="empty">正在加载…</div></main>

  <section class="about" aria-label="说明">
    <div><h2>价格线</h2><p>每个型号都有一条标准价。开箱、翻新会更严，ROG、Alienware 会适当放宽。</p></div>
    <div><h2>自动检查</h2><p>持续检查 Slickdeals、Reddit、Woot、Tom's Hardware 等来源，用 AI 读出型号、成色和价格，再和价格线对比。</p></div>
    <div><h2>以商家为准</h2><p>好价格通常很快就没了。下单前请在商家页面确认价格、成色和库存。</p></div>
  </section>

  <footer id="status">&nbsp;</footer>
</div>

<script>
// ===== 设置（只改这里）=====
const SUPABASE_URL = "https://pmjmexfueofdaubcumgk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_l02lU8RFOe5RwSkO-YasHw_MBTgd-av";   // 公开 key，可以放在网页里
const SUBSCRIBE_URL = "";                                                       // MailerLite 订阅表单链接
const DAYS = 14;                                                                 // 显示最近几天的 deal
// ==========================

const LABELS = { laptop:"游戏笔记本", desktop:"台式机", graphics_card:"显卡", ssd:"固态硬盘", hdd:"机械硬盘" };
const COND = { new:"全新", open_box:"开箱", refurb:"翻新", used:"二手" };
const SRC = { slickdeals:"Slickdeals", reddit:"Reddit", tomshardware:"Tom's Hardware", techradar:"TechRadar", woot:"Woot" };
const HEADERS = SUPABASE_ANON_KEY.startsWith("eyJ")
  ? { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
  : { apikey: SUPABASE_ANON_KEY };
let deals = [], current = "all";

const $ = id => document.getElementById(id);
if (SUBSCRIBE_URL) $("subscribe").href = SUBSCRIBE_URL; else $("subscribe").hidden = true;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const money = (x, cents) => "$" + Number(x).toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: 2 });
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - new Date(t)) / 60000));
  if (m < 1) return "刚刚";
  if (m < 60) return m + " 分钟前";
  if (m < 1440) return Math.round(m / 60) + " 小时前";
  return Math.round(m / 1440) + " 天前";
}
// 标题清理：去掉开头的 [GPU] 这类标签、结尾的价格和商家，信息已经单独显示
function cleanTitle(t) {
  return String(t || "")
    .replace(/^\s*\[[^\]]{1,20}\]\s*/, "")
    .replace(/^\s*\$[\d,.]+\*?\s*\|\s*/, "")
    .replace(/\s+[-–]?\s*\$[\d,]+(\.\d+)?\s*(\+.*|after.*|w\/.*|@.*|\(.*\))?$/i, "")
    .replace(/\s+@\s+[\w .'&-]+$/, "")
    .trim();
}

function renderFilters() {
  const cats = Object.keys(LABELS).filter(c => deals.some(d => d.category === c));
  const items = [["all", "全部", deals.length], ...cats.map(c => [c, LABELS[c], deals.filter(d => d.category === c).length])];
  $("filters").innerHTML = items.map(([c, label, n]) =>
    `<button type="button" data-c="${c}" aria-pressed="${c === current}">${label}<span>${n}</span></button>`).join("");
}

function renderList() {
  const shown = current === "all" ? deals : deals.filter(d => d.category === current);
  if (!shown.length) {
    $("list").innerHTML = `<div class="empty"><strong>最近 ${DAYS} 天没有过线的优惠</strong>价格线定得比较严，有符合的会第一时间出现在这里。${SUBSCRIBE_URL ? `想第一时间知道，可以<a href="${esc(SUBSCRIBE_URL)}" target="_blank" rel="noopener">订阅邮件</a>。` : ""}</div>`;
    return;
  }
  $("list").innerHTML = shown.map(d => {
    const facts = [LABELS[d.category], COND[d.condition], d.quantity > 1 ? `${d.quantity} 件装` : "", d.store,
                   SRC[d.source] ? `来自 ${SRC[d.source]}` : "", ago(d.created_at)].filter(Boolean);
    return `<article class="deal">
      <h2 class="deal-title"><a href="${esc(d.url)}" target="_blank" rel="noopener" title="${esc(d.title)}">${esc(cleanTitle(d.title))}</a></h2>
      <div class="price-col"><div class="price">${money(d.price)}</div></div>
      <div class="facts">${d.pinned ? `<span class="pin">置顶</span>` : ""}${facts.map(f => `<span>${esc(f)}</span>`).join("")}</div>
    </article>`;
  }).join("");
}

function renderHero(evaluated) {
  const kept = deals.length;
  $("kept").textContent = kept;
  $("seen").textContent = evaluated || "–";
  $("ratio").setAttribute("aria-hidden", "false");
  $("ratio").setAttribute("aria-label", `${evaluated} 条里留下 ${kept} 条`);
  $("heroText").textContent = evaluated
    ? `近 ${DAYS} 天，我们评估了 ${evaluated} 条电脑硬件优惠，只有 ${kept} 条低于价格线。剩下的，都不够便宜。`
    : `我们给每类电脑硬件定了一条价格线。只有低于这条线的优惠，才会出现在这里。`;
}

$("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  current = b.dataset.c; renderFilters(); renderList();
});

async function get(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: HEADERS });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

(async () => {
  const since = new Date(Date.now() - DAYS * 86400000).toISOString();
  try {
    const [rows, runs] = await Promise.all([
      get(`deals?select=title,url,source,price,category,condition,quantity,store,created_at,pinned,pinned_at&status=eq.passed&or=(created_at.gte.${since},pinned.is.true)&order=pinned.desc,pinned_at.desc.nullslast,created_at.desc&limit=300`),
      get(`runs?select=finished_at,new_deals&finished_at=gte.${since}&order=finished_at.desc&limit=5000`).catch(() => []),
    ]);
    deals = rows;
    const evaluated = Math.max(runs.reduce((s, r) => s + (r.new_deals || 0), 0), deals.length);
    renderHero(runs.length ? evaluated : 0);
    renderFilters(); renderList();
    $("status").textContent = runs.length ? `上次检查在 ${ago(runs[0].finished_at)}。价格以商家页面为准。` : "价格以商家页面为准。";
  } catch (e) {
    $("list").innerHTML = `<div class="empty"><strong>暂时读不到数据</strong>请稍后刷新页面。</div>`;
  }
})();
</script>
</body>
</html>
