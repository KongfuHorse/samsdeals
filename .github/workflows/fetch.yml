name: 抓取并筛选 deal

on:
  schedule:
    - cron: "*/10 * * * *"     # 每 10 分钟唤醒一次；真正多久抓一次，在后台"刷新设置"里改
  workflow_dispatch:            # 也可以在 Actions 页面手动点 Run workflow

concurrency:                    # 同一时间只跑一个，避免重复抓取
  group: fetch
  cancel-in-progress: false

jobs:
  run:
    runs-on: self-hosted        # 在你自己的电脑上运行（用家里的网络）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # 自己电脑上用系统自带的 python3，依赖装在固定位置，下次直接复用
      - name: 准备 Python 环境
        run: |
          VENV="$HOME/.samsdeals-venv"
          [ -x "$VENV/bin/python" ] || python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q --upgrade pip
          "$VENV/bin/pip" install -q -r requirements.txt
      - name: 抓取
        run: |
          echo "运行电脑：$(hostname)  公网 IP：$(curl -s --max-time 5 https://api.ipify.org || echo 未知)"
          "$HOME/.samsdeals-venv/bin/python" run.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
